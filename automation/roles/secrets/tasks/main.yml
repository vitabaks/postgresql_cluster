---
- name: Manage secrets with AWS Secrets Manager
  ansible.builtin.include_tasks: aws.yml
  vars:
    secrets_value_only_mode: "{{ secrets_aws_value_only | bool }}"
    secrets_connection_info: "{{ hostvars['localhost']['connection_info_for_secrets'] | default(none) }}"
    secrets_export_connection: >-
      {{ secrets_export_connection_info | bool and secrets_connection_info is not none }}
    secrets_users_path: "{{ secrets_postgresql_users_path | regex_replace('^/+|/+$', '') }}"
    secrets_users_share_connection_secret: >-
      {{
        secrets_export_postgresql_users | bool
        and secrets_users_path == (secrets_connection_info_path | regex_replace('^/+|/+$', ''))
      }}
    # Default mode: one secret per user. Value-only mode: only users with their own "secret".
    postgresql_user_secret_items: >-
      {{
        (
          hostvars['localhost']['postgresql_users_for_secrets'] | default([])
          if not secrets_value_only_mode | bool
          else hostvars['localhost']['postgresql_users_for_secrets'] | default([]) | selectattr('secret') | list
        )
        if secrets_export_postgresql_users | bool
        else []
      }}
    # Value-only mode: all users without their own "secret" in one secret under the "users" key, merged into the current value.
    # Users with known passwords are added or updated, removed users are deleted (null in a merge patch).
    postgresql_users_patch: >-
      {%- set patch = {} -%}
      {%- for user in hostvars['localhost']['postgresql_users_for_secrets'] | default([]) | rejectattr('secret') -%}
        {%- set _ = patch.update({user.username: user.password}) -%}
      {%- endfor -%}
      {%- for name in hostvars['localhost']['postgresql_users_removed_for_secrets'] | default([]) -%}
        {%- set _ = patch.update({name: none}) -%}
      {%- endfor -%}
      {{ patch }}
    postgresql_users_secret_items: >-
      {{
        [{'name': secrets_postgresql_users_path, 'value': {'users': postgresql_users_patch}, 'merge': true, 'replace_non_object': true}]
        if secrets_export_postgresql_users | bool and secrets_value_only_mode | bool
        and postgresql_users_patch | length > 0
        and not (secrets_users_share_connection_secret | bool and secrets_export_connection | bool)
        else []
      }}
    # Value-only mode: connection info is stored under the "connection" key, which is replaced entirely on every run.
    # The secret is merged, so other keys stored in it are kept, including users when the secret is shared with them.
    # Merging needs value comparison and a string secret; otherwise a secret not shared with users is replaced entirely.
    secrets_connection_merge: >-
      {{
        secrets_users_share_connection_secret | bool
        or (secrets_aws_value_compare | bool and secrets_aws_secret_type | default('string', true) != 'binary')
      }}
    connection_info_secret_items: >-
      {{
        [
          {'name': secrets_connection_info_path, 'value': secrets_connection_info}
          if not secrets_value_only_mode | bool
          else {
            'name': secrets_connection_info_path,
            'value': {'connection': secrets_connection_info}
              | combine(
                {'users': postgresql_users_patch}
                if secrets_users_share_connection_secret | bool and postgresql_users_patch | length > 0
                else {}
              ),
            'merge': true,
            'replace_non_object': true,
            'replace_keys': ['connection']
          }
          if secrets_connection_merge | bool
          else {'name': secrets_connection_info_path, 'value': {'connection': secrets_connection_info}}
        ]
        if secrets_export_connection | bool
        else []
      }}
    secrets_items: >-
      {{ secrets_values + postgresql_user_secret_items + postgresql_users_secret_items + connection_info_secret_items }}
  when:
    - secrets_provider | lower == 'aws'
    - secrets_items | length > 0
