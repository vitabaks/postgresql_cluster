---
- name: Check if PostgreSQL process is running
  command: pgrep -u postgres
  register: result
  failed_when: result.rc != 0

- name: Check if PostgreSQL is listening on the default port
  ansible.builtin.wait_for:
    port: 5432
    timeout: 5
  register: is_listening
  failed_when: not is_listening

- name: Try to connect to PostgreSQL
  postgresql_ping:
    login_unix_socket: "{{ postgresql_unix_socket_dir }}"
    login_port: "{{ postgresql_port }}"
    login_user: "{{ patroni_superuser_username }}"
    login_db: template1

# The default scenario randomly selects the locale provider (see default/converge.yml).
- name: Get the locale provider of the template databases
  community.postgresql.postgresql_query:
    query: "SELECT datname, datlocprovider, datlocale FROM pg_database WHERE datname IN ('template0', 'template1') ORDER BY datname"
    login_unix_socket: "{{ postgresql_unix_socket_dir }}"
    login_port: "{{ postgresql_port }}"
    login_user: "{{ patroni_superuser_username }}"
    login_db: template1
  register: pg_locale_provider

- name: Check that initdb used the configured locale provider
  vars:
    expected_locale_provider: "{{ {'': 'c', 'libc': 'c', 'icu': 'i', 'builtin': 'b'}[postgresql_locale_provider] }}"
    expected_locale: >-
      {{ postgresql_builtin_locale if postgresql_locale_provider == 'builtin'
         else postgresql_icu_locale if postgresql_locale_provider == 'icu' else none }}
  ansible.builtin.assert:
    that:
      - pg_locale_provider.query_result | length == 2
      - pg_locale_provider.query_result | map(attribute='datlocprovider') | unique | list == [expected_locale_provider]
      - pg_locale_provider.query_result | map(attribute='datlocale') | unique | list == [expected_locale]
    fail_msg: >-
      Expected locale provider '{{ expected_locale_provider }}' and locale '{{ expected_locale }}', got {{ pg_locale_provider.query_result }}
    success_msg: "template0 and template1 use the configured locale provider ({{ postgresql_locale_provider | default('libc', true) }})"
