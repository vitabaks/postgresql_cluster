---
# 🚀 These tasks aim to validate the initdb locale provider options (issue #1726)
# 🎯 Render the real patroni.yml.j2 and run the real pre_checks/tasks/locale.yml for a set of cases:
# postgresql_locale_provider adds 'locale-provider' and 'icu-locale' or 'builtin-locale' to bootstrap.initdb,
# an empty value keeps bootstrap.initdb unchanged, and the pre-check rejects invalid combinations with the expected check and message.
# The per-case tasks live in ../initdb_locale/ (this directory is globbed, so it holds no helper files).

# 📂 Ensure tmp directory exists
- name: Molecule.tests.roles.patroni.variables.initdb_locale | Ensure tmp directory exists
  run_once: true
  delegate_to: localhost
  ansible.builtin.file:
    path: "./tmp"
    state: directory

# ==============================================
# 💻 Scenario: bootstrap.initdb in patroni.yml
# ==============================================

- name: Molecule.tests.roles.patroni.variables.initdb_locale | Render patroni.yml and validate bootstrap.initdb
  run_once: true
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tests/roles/patroni/initdb_locale/render.yml"
  vars:
    postgresql_version: "{{ initdb_locale_case.version }}"
    postgresql_encoding: "UTF8"
    postgresql_locale: "en_US.UTF-8"
    postgresql_data_checksums: "{{ initdb_locale_case.data_checksums | default(true) }}"
    postgresql_locale_provider: "{{ initdb_locale_case.provider | default('') }}"
    postgresql_icu_locale: "{{ initdb_locale_case.icu_locale | default('') }}"
    postgresql_builtin_locale: "{{ initdb_locale_case.builtin_locale | default('C.UTF-8') }}"
  loop:
    - name: default
      version: 18
      expected: [{ encoding: UTF8 }, { locale: en_US.UTF-8 }, data-checksums]
    - name: builtin
      version: 18
      provider: builtin
      expected: [{ encoding: UTF8 }, { locale: en_US.UTF-8 }, { locale-provider: builtin }, { builtin-locale: C.UTF-8 }, data-checksums]
    - name: builtin_c
      version: 17
      provider: builtin
      builtin_locale: C
      expected: [{ encoding: UTF8 }, { locale: en_US.UTF-8 }, { locale-provider: builtin }, { builtin-locale: C }, data-checksums]
    - name: builtin_no_checksums
      version: 18
      provider: builtin
      data_checksums: false
      expected: [{ encoding: UTF8 }, { locale: en_US.UTF-8 }, { locale-provider: builtin }, { builtin-locale: C.UTF-8 }, no-data-checksums]
    - name: icu
      version: 16
      provider: icu
      icu_locale: und
      expected: [{ encoding: UTF8 }, { locale: en_US.UTF-8 }, { locale-provider: icu }, { icu-locale: und }, data-checksums]
    - name: icu_pg15 # initdb 15 requires --icu-locale
      version: 15
      provider: icu
      icu_locale: und
      expected: [{ encoding: UTF8 }, { locale: en_US.UTF-8 }, { locale-provider: icu }, { icu-locale: und }, data-checksums]
    - name: icu_norwegian # "no" must stay a string, not a YAML boolean
      version: 16
      provider: icu
      icu_locale: "no"
      expected: [{ encoding: UTF8 }, { locale: en_US.UTF-8 }, { locale-provider: icu }, { icu-locale: "no" }, data-checksums]
    - name: libc
      version: 16
      provider: libc
      expected: [{ encoding: UTF8 }, { locale: en_US.UTF-8 }, { locale-provider: libc }, data-checksums]
  loop_control:
    loop_var: initdb_locale_case
    label: "{{ initdb_locale_case.name }}"

# ==============================================
# 💻 Scenario: pre_checks/tasks/locale.yml
# ==============================================

- name: Molecule.tests.roles.patroni.variables.initdb_locale | Run the locale pre-check and validate the result
  run_once: true
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tests/roles/patroni/initdb_locale/pre_check.yml"
  vars:
    postgresql_version: "{{ initdb_locale_case.version }}"
    postgresql_encoding: "{{ initdb_locale_case.encoding | default('UTF8') }}"
    postgresql_locale_provider: "{{ initdb_locale_case.provider | default('') }}"
    postgresql_icu_locale: "{{ initdb_locale_case.icu_locale | default('') }}"
    postgresql_builtin_locale: "{{ initdb_locale_case.builtin_locale | default('C.UTF-8') }}"
  # expected: 'pass', or the check that fails (task name after "Locale provider | Checking "); msg: a part of the failure message
  loop:
    - name: "PG18 default provider"
      version: 18
      expected: pass
    - name: "PG14 default provider"
      version: 14
      expected: pass
    - name: "PG18 builtin C.UTF-8"
      version: 18
      provider: builtin
      expected: pass
    - name: "PG18 builtin PG_UNICODE_FAST"
      version: 18
      provider: builtin
      builtin_locale: PG_UNICODE_FAST
      expected: pass
    - name: "PG17 builtin PG_UNICODE_FAST"
      version: 17
      provider: builtin
      builtin_locale: PG_UNICODE_FAST
      expected: postgresql_builtin_locale
      msg: "C, C.UTF-8."
    - name: "PG17 builtin C"
      version: 17
      provider: builtin
      builtin_locale: C
      expected: pass
    - name: "PG16 builtin"
      version: 16
      provider: builtin
      expected: PostgreSQL version
      msg: "must be 17 or higher"
    - name: "PG18 builtin en_US.UTF-8"
      version: 18
      provider: builtin
      builtin_locale: en_US.UTF-8
      expected: postgresql_builtin_locale
      msg: "'en_US.UTF-8' (PostgreSQL 18)"
    - name: "PG18 builtin C.UTF-8 LATIN1"
      version: 18
      provider: builtin
      encoding: LATIN1
      expected: postgresql_encoding for the builtin provider
      msg: "'LATIN1'"
    - name: "PG18 builtin C LATIN1"
      version: 18
      provider: builtin
      builtin_locale: C
      encoding: LATIN1
      expected: pass
    - name: "PG18 builtin C.UTF-8 encoding UTF-8"
      version: 18
      provider: builtin
      encoding: UTF-8
      expected: pass
    - name: "PG16 icu without icu_locale"
      version: 16
      provider: icu
      expected: postgresql_icu_locale
      msg: "current: ''"
    - name: "PG16 icu unquoted no (boolean)"
      version: 16
      provider: icu
      icu_locale: false
      expected: postgresql_icu_locale
      msg: "current: 'False'"
    - name: "PG16 icu und"
      version: 16
      provider: icu
      icu_locale: und
      expected: pass
    - name: "PG15 icu und"
      version: 15
      provider: icu
      icu_locale: und
      expected: pass
    - name: "PG14 icu und"
      version: 14
      provider: icu
      icu_locale: und
      expected: PostgreSQL version
      msg: "must be 15 or higher"
    - name: "PG16 icu und LATIN1"
      version: 16
      provider: icu
      icu_locale: und
      encoding: LATIN1
      expected: pass
    - name: "PG16 icu und SQL_ASCII"
      version: 16
      provider: icu
      icu_locale: und
      encoding: SQL_ASCII
      expected: postgresql_encoding for the ICU provider
      msg: "'SQL_ASCII'"
    - name: "PG16 icu und ISO-8859-16"
      version: 16
      provider: icu
      icu_locale: und
      encoding: ISO-8859-16
      expected: postgresql_encoding for the ICU provider
      msg: "'ISO-8859-16'"
    - name: "PG15 libc"
      version: 15
      provider: libc
      expected: pass
    - name: "PG14 libc"
      version: 14
      provider: libc
      expected: PostgreSQL version
      msg: "(14) does not support postgresql_locale_provider: 'libc'"
    - name: "PG18 unknown provider"
      version: 18
      provider: bogus
      expected: postgresql_locale_provider value
      msg: "Unsupported postgresql_locale_provider: 'bogus'"
  loop_control:
    loop_var: initdb_locale_case
    label: "{{ initdb_locale_case.name }}"
