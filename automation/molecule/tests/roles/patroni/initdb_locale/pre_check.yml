---
# 🚀 Run the real pre_checks/tasks/locale.yml for one case (initdb_locale_case) and compare the result with the expected one:
# 'pass', or the check that fails (its task name after 'Locale provider | Checking ') and a part of its message (initdb_locale_case.msg)
# Included from ../variables/initdb_locale.yml

# No run_once on the block: with several hosts, a rescued failure inside a run_once block makes ansible-playbook exit with 2.
# The tasks run on one host anyway, because the include in ../variables/initdb_locale.yml is run_once.
- name: Molecule.tests.roles.patroni.initdb_locale.pre_check | Run the locale pre-check ({{ initdb_locale_case.name }})
  block:
    - name: Molecule.tests.roles.patroni.initdb_locale.pre_check | Include pre_checks/tasks/locale.yml
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../roles/pre_checks/tasks/locale.yml"

    - name: Molecule.tests.roles.patroni.initdb_locale.pre_check | Pre-check passed
      ansible.builtin.set_fact:
        initdb_locale_pre_check_result: pass
        initdb_locale_pre_check_msg: ""
  rescue:
    - name: Molecule.tests.roles.patroni.initdb_locale.pre_check | Pre-check failed (expected for invalid settings)
      ansible.builtin.set_fact:
        initdb_locale_pre_check_result: "{{ ansible_failed_task.name | default('unknown task') | regex_replace('^Locale provider [|] Checking ', '') }}"
        initdb_locale_pre_check_msg: "{{ [ansible_failed_result.msg | default('')] | flatten | join(' ') }}"

- name: Molecule.tests.roles.patroni.initdb_locale.pre_check | Validate the pre-check result ({{ initdb_locale_case.name }})
  run_once: true
  ansible.builtin.assert:
    that:
      - initdb_locale_pre_check_result == initdb_locale_case.expected
      - initdb_locale_case.expected == 'pass' or initdb_locale_case.msg in initdb_locale_pre_check_msg
    fail_msg: >-
      Test failed ({{ initdb_locale_case.name }}): result '{{ initdb_locale_pre_check_result }}' ({{ initdb_locale_pre_check_msg }}),
      expected '{{ initdb_locale_case.expected }}' ({{ initdb_locale_case.msg | default('') }}).
    success_msg: "Test passed ({{ initdb_locale_case.name }}): the pre-check result is '{{ initdb_locale_pre_check_result }}'."
